name: Promotion preflight

# Checks that `development` is safe to promote to `main`, and prints the
# command to do it. It does NOT push.
#
# Why it does not push:
#
# This workflow used to fast-forward `main` itself. That never once worked.
# Its first real run (2026-09-19, run_number 1, months after it was written)
# died on:
#
#     remote: error: GH006: Protected branch update failed for refs/heads/main.
#     remote: - Changes must be made through a pull request.
#
# The header used to say the fix was to add the github-actions bot to
# "Allow specified actors to bypass required pull requests". That setting
# exists, but `github-actions[bot]` cannot be put in it: the bypass actor
# picker -- classic branch protection and rulesets alike -- offers roles,
# teams, users, and *installed GitHub Apps*, and the built-in Actions token
# is none of those. `GITHUB_TOKEN` cannot be granted bypass on a protected
# branch under either mechanism. The prerequisite was unachievable, so the
# workflow was dead on arrival and the merge button got used instead --
# which is exactly how `main` and `development` diverged in August 2026 and
# needed a one-off recovery sync (SH-1).
#
# Swapping in a PAT or GitHub App token would work, but it buys one click at
# the price of a secret to rotate plus a live trap: the old "Trigger release
# build" step dispatched Docker Builder explicitly *because* a GITHUB_TOKEN
# push does not trigger workflows. A PAT push DOES trigger them, so keeping
# both would start two concurrent Docker Builder runs on one commit, each
# bumping the version and cutting a release -- the same defect as the
# orphaned v1.10.1 described in main.yaml's header.
#
# So: the human runs the push. That also removes the dispatch entirely,
# because a push made by a person triggers Docker Builder on `main` all by
# itself (verified 2026-09-19: run #217, event: push, produced v1.10.12).
#
# What is kept is the part that had real value and would have caught the
# August divergence at the moment it mattered: the ancestry guard.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Check main can fast-forward to development
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify main can fast-forward to development
        id: check
        run: |
          set -euo pipefail
          git fetch origin main development

          MAIN_SHA=$(git rev-parse origin/main)
          DEV_SHA=$(git rev-parse origin/development)
          echo "main:        ${MAIN_SHA}"
          echo "development: ${DEV_SHA}"

          if [ "${MAIN_SHA}" = "${DEV_SHA}" ]; then
            echo "::error::main is already at development. Nothing to promote." >&2
            exit 1
          fi

          # The fast-forward is only valid if main is an ancestor of
          # development. If it is not, something landed directly on main and
          # promoting would silently discard it.
          if ! git merge-base --is-ancestor "${MAIN_SHA}" "${DEV_SHA}"; then
            echo "::error::main is NOT an ancestor of development -- the branches have diverged." >&2
            echo "::error::Something was committed directly to main. Fast-forward would lose it." >&2
            echo "Commits on main that development lacks:" >&2
            git log --oneline "${DEV_SHA}..${MAIN_SHA}" >&2
            echo "Recover with a one-off main -> development sync PR, then retry." >&2
            exit 1
          fi

          echo "Commits that would be promoted to main:"
          git log --oneline "${MAIN_SHA}..${DEV_SHA}"
          echo "dev_sha=${DEV_SHA}" >> "$GITHUB_OUTPUT"

      - name: Print the promotion command
        env:
          DEV_SHA: ${{ steps.check.outputs.dev_sha }}
        run: |
          set -euo pipefail
          {
            echo "### Ready to promote"
            echo ""
            echo "\`main\` can fast-forward to \`${DEV_SHA}\` cleanly."
            echo ""
            echo "Run this locally to publish the release:"
            echo ""
            echo '```bash'
            echo "git fetch origin main development"
            echo "git push origin ${DEV_SHA}:refs/heads/main"
            echo '```'
            echo ""
            echo "No \`--force\` is needed or wanted: this is a fast-forward, so"
            echo "git refuses the push if anything landed on \`main\` in the"
            echo "meantime -- which is the safety property the old force-with-lease"
            echo "was there to provide."
            echo ""
            echo "The push triggers Docker Builder on \`main\` by itself. It"
            echo "publishes \`latest\`, bumps the semver tag, and cuts the GitHub"
            echo "release, from the exact commit that was built and tested as"
            echo "\`:dev\`. Do not dispatch Docker Builder as well -- that would"
            echo "build and release the same commit twice."
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
